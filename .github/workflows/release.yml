name: Release

on:
  push:
    tags:
      - "v*"
  # Manual trigger for environments that can't push tags: creates the tag
  # (via the release action) on the selected ref and publishes the release.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.0.1 (created if it doesn't exist)"
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  release:
    name: build & publish (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcb1-dev \
            libx11-dev \
            libxi-dev \
            libxcursor-dev \
            libxrandr-dev \
            libwayland-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo build (release)
        run: cargo build --release --locked

      - name: Package tarball
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          pkg="argus-lasso-${version}-${{ matrix.arch }}-linux"
          mkdir -p "${pkg}/assets"
          cp target/release/argus-lasso "${pkg}/"
          cp -r dist LICENSE README.md Makefile "${pkg}/"
          # Keep the icon masters under assets/ rather than flattened into the
          # package root: the bundled Makefile looks for them there, and the
          # in-app updater renders the small sizes from the tiered masters
          # when it refreshes an existing icon install.
          cp assets/icon.svg assets/icon-medium.svg assets/icon-small.svg \
             assets/icon.png "${pkg}/assets/"
          tar czf "${pkg}.tar.gz" "${pkg}"
          sha256sum "${pkg}.tar.gz" > "${pkg}.tar.gz.sha256"

      - name: Sign tarball
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [ -z "${MINISIGN_SECRET_KEY}" ]; then
            echo "::error::MINISIGN_SECRET_KEY is not set — the release would" \
                 "be unsigned and the in-app updater would refuse to install it."
            exit 1
          fi
          sudo apt-get install -y --no-install-recommends minisign
          version="${RELEASE_TAG#v}"
          pkg="argus-lasso-${version}-${{ matrix.arch }}-linux"
          umask 077
          printf '%s\n' "${MINISIGN_SECRET_KEY}" > minisign.key
          printf '%s\n' "${MINISIGN_PASSWORD}" \
            | minisign -S -s minisign.key -m "${pkg}.tar.gz"
          shred -u minisign.key
          # Fail here rather than publishing something clients will reject.
          minisign -Vm "${pkg}.tar.gz" -p dist/argus-lasso.pub

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            argus-lasso-*.tar.gz
            argus-lasso-*.tar.gz.sha256
            argus-lasso-*.tar.gz.minisig
          # Notes are written by the release-notes job below — generating them
          # here would append one copy per matrix job / re-run.
          generate_release_notes: false

  release-notes:
    name: regenerate release notes
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Overwrite notes with freshly generated ones (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$tag" --jq .body > notes.md
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
