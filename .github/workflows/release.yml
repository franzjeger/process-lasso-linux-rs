name: Release

on:
  push:
    tags:
      - "v*"
  # Manual trigger for environments that can't push tags: creates the tag
  # (via the release action) on the selected ref and publishes the release.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.0.1 (created if it doesn't exist)"
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  release:
    name: build & publish (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcb1-dev \
            libx11-dev \
            libxi-dev \
            libxcursor-dev \
            libxrandr-dev \
            libwayland-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo build (release)
        run: cargo build --release --locked

      - name: Package tarball
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          pkg="argus-lasso-${version}-${{ matrix.arch }}-linux"
          mkdir -p "${pkg}"
          cp target/release/argus-lasso "${pkg}/"
          cp -r dist LICENSE README.md Makefile assets/icon.png "${pkg}/"
          tar czf "${pkg}.tar.gz" "${pkg}"
          sha256sum "${pkg}.tar.gz" > "${pkg}.tar.gz.sha256"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            argus-lasso-*.tar.gz
            argus-lasso-*.tar.gz.sha256
          generate_release_notes: true
